name: Build MotionGlass v0.2 from ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'MotionGlass-v0.2-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get source archive
        uses: actions/checkout@v4
      - name: Extract source
        run: |
          test -f MotionGlass-v0.2-Source.zip
          mkdir -p project
          unzip -q MotionGlass-v0.2-Source.zip -d project
          test -f project/app/build.gradle
          test -f project/tests/test_spring.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Get Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate spring response
        working-directory: project
        run: python3 tests/test_spring.py
      - name: Compile LSPosed APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionGlass-v0.2-LSPosed-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
